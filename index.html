<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>딸깍 보결</title>
  <meta name="description" content="갑자기 보결 들어간 초등 선생님을 위한 40분 모둠 수업. 학년만 누르면 시작돼요.">
  <meta name="theme-color" content="#f4f6fa">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <!-- 느린 망에서만 '여는 중' 안내를 보인다(css/app.css .boot-msg). 스타일시트보다 앞에 두어야 바로 돈다. -->
  <script>setTimeout(function () { document.documentElement.classList.add('slow-boot'); }, 600);</script>
  <!-- 글꼴(약 300KB)은 글자를 그릴 때에야 받기 시작하므로 미리 받는다(글꼴이 늦게 바뀌어 화면이 출렁이지 않게) -->
  <link rel="preload" href="assets/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- 모듈 미리 받기: npm run stamp 가 js/main.js 에서 닿는 모듈로 새로 씀 -->
  <link rel="modulepreload" href="js/core/data.js">
  <link rel="modulepreload" href="js/core/plan.js">
  <link rel="modulepreload" href="js/core/flows.js">
  <link rel="modulepreload" href="js/core/rng.js">
  <link rel="modulepreload" href="js/ui/start.js">
  <link rel="modulepreload" href="js/ui/dom.js">
  <link rel="modulepreload" href="js/ui/icons.js">
  <link rel="modulepreload" href="js/ui/icon-paths.js">
  <link rel="modulepreload" href="js/ui/live.js">
  <link rel="modulepreload" href="js/ui/pages.js">
  <link rel="modulepreload" href="js/ui/runner.js">
  <link rel="modulepreload" href="js/ui/guard.js">
  <link rel="modulepreload" href="js/core/session.js">
  <link rel="modulepreload" href="js/core/rules.js">
  <link rel="modulepreload" href="js/activities/index.js">
  <link rel="modulepreload" href="js/activities/greet.js">
  <link rel="modulepreload" href="js/activities/word.js">
  <link rel="modulepreload" href="js/core/wordTypes.js">
  <link rel="modulepreload" href="js/activities/gesture.js">
  <link rel="modulepreload" href="js/ui/fx.js">
  <link rel="modulepreload" href="js/activities/quizboard.js">
  <link rel="modulepreload" href="js/activities/story.js">
  <link rel="modulepreload" href="js/activities/celebrate.js">
  <link rel="modulepreload" href="js/ui/sfx.js">
  <!-- /모듈 미리 받기 -->
</head>
<body>
  <!-- 첫 화면을 그리기 전(느린 망) 빈 화면 대신 보이는 안내. js/main.js 가 첫 화면으로 바꾼다. -->
  <div id="app"><main class="start"><p class="boot-msg">딸깍 보결을 여는 중이에요…</p></main></div>
  <noscript>이 사이트는 자바스크립트가 켜져 있어야 해요.</noscript>
  <!-- 서비스 워커(오프라인 사본)는 첫 화면·글꼴·자료를 다 받은 뒤 js/main.js 가 등록한다 -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
