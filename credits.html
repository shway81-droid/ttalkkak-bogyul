<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인물 사진 출처 · 딸깍 보결</title>
  <meta name="theme-color" content="#f4f6fa">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/credits.css">
</head>
<body>
  <main class="credits">
    <p><a class="back" href="./">처음 화면으로</a></p>
    <h1>인물 사진 출처</h1>
    <p class="lead">인물 퀴즈의 사진은 위키미디어 공용 등에 자유 라이선스로 올라온 사진에서 인물 얼굴 부분을 잘라 내고 크기를 줄인 것입니다(파일 형식은 WebP).
      사진마다 저작자와 라이선스를 아래에 밝히며, 각 사진은 원래의 라이선스를 따릅니다.
      인물 힌트와 사진 고르기는 <a href="https://github.com/shway81-droid/jjam-classroom">짬짬이</a> 낱말의 인물퀴즈 자료입니다.</p>
    <p class="count" id="count">불러오는 중…</p>
    <table>
      <thead><tr><th>번호</th><th>인물</th><th>사진 저작자</th><th>라이선스</th><th>원본</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <noscript>이 페이지는 자바스크립트가 켜져 있어야 해요.</noscript>
  <script type="module" src="js/credits.js"></script>
  <script>
    // 한 번 열면 인터넷이 끊겨도 쓸 수 있게(sw.js)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
